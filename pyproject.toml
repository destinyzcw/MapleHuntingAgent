[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maple-hunting-agent"
version = "0.1.0"
description = "Mac-hosted MapleStory hunting agent using JEV and UU remote desktop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
maple-agent = "maple_hunting_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
